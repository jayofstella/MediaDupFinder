name: Build Windows releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python 3.8
        uses: actions/setup-python@v7
        with:
          python-version: "3.8.10"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm MediaDupFinder.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\MediaDupFinder.exe" -ArgumentList "--startup-check" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable startup check failed with exit code $($process.ExitCode)"
          }

      - name: Package release ZIP
        run: python scripts/package_release.py --arch ${{ matrix.architecture }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediaDupFinder-Windows-${{ matrix.architecture }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --generate-notes --title "MediaDupFinder ${GITHUB_REF_NAME}"

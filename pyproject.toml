[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-dup-finder"
version = "1.2.2"
description = "A local, explainable filename-aware duplicate media finder."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "MediaDupFinder contributors"}]
keywords = ["duplicate-files", "video", "filename-matching", "windows", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
]
dependencies = []

[project.gui-scripts]
media-dup-finder = "media_dup_finder.app:main"

[tool.setuptools.packages.find]
where = ["src"]
